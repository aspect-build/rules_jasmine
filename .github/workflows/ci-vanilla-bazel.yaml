name: CI - Vanilla Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # Note: linux is tested on Buildkite via Aspect Workflows
    # Only run MacOS and Windows on main branch (not PRs) to minimize minutes (billed at 10X and 2X respectively)
    # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
    if: |
      github.ref_name == 'main' ||
      (matrix.os == 'macos' && contains(github.head_ref, 'macos')) ||
      (matrix.os == 'windows' && contains(github.head_ref, 'windows'))
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos
          - windows
        folder:
          - "."
          - "e2e/jasmine_test"
          - "e2e/smoke"

    steps:
      - uses: actions/checkout@v6

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}-${{ matrix.folder }}
          repository-cache: true

      - name: bazel test //...
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          BAZEL_MAJOR=$(head -c 1 .bazelversion)
          bazel \
            --bazelrc=${GITHUB_WORKSPACE//\\/\/}/.github/workflows/ci.bazelrc \
            test \
            --test_tag_filters=-skip-on-bazel${BAZEL_MAJOR} \
            --build_tag_filters=-skip-on-bazel${BAZEL_MAJOR} \
            //...
